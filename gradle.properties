## Trace — Gradle build configuration

org.gradle.jvmargs=-Xmx6144M -Dkotlin.daemon.jvm.options\="-Xmx6144M" -XX:+UseParallelGC
org.gradle.parallel=true
org.gradle.daemon=true
org.gradle.configureondemand=false
org.gradle.configuration-cache=false
org.gradle.caching=true

android.useAndroidX=true
android.enableJetifier=false
android.nonTransitiveRClass=false
android.newDsl=false
android.suppressUnsupportedOptionWarnings=android.suppressUnsupportedOptionWarnings,android.nonFinalResIds

kotlin.incremental=true
ksp.incremental=true

# Longer timeouts for JitPack dependency downloads (innertubex, NewPipeExtractor, ...)
systemProp.org.gradle.internal.http.connectionTimeout=180000
systemProp.org.gradle.internal.http.socketTimeout=180000

# ===========================================================================
#  APPLICATION IDENTITY — change these values to rebrand the application.
#  (See scripts/rebrand.ps1 to also relocate the Kotlin package namespace.)
# ===========================================================================
Trace.appId=com.example.musicplayer
Trace.namespace=com.example.musicplayer
Trace.versionName=2.6.0
Trace.versionCode=10

# ===========================================================================
#  UPDATE FEED
#  URL of the JSON file that tells the app a newer version exists.
#  Point this at a raw file you control (GitHub raw, GitHub Pages,
#  Cloudflare Pages, any static host). Leave blank to disable update checks.
#  The schema is documented in updates.json at the repository root.
# ===========================================================================
Trace.updateFeedUrl=

# Release signing (optional). If the keystore file is absent, the debug key
# is used for release builds so the build never fails.
Trace.release.storeFile=keystore/Trace-release.keystore
Trace.release.storePassword=Trace-release
Trace.release.keyAlias=Trace
Trace.release.keyPassword=Trace-release
